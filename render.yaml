services:
  - type: web
    name: mk-school-api
    runtime: node
    region: frankfurt
    plan: 1c-2g
    buildCommand: cd video_engine_backend && npm ci && npm run build
    startCommand: cd video_engine_backend && npm start
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    disk:
      name: school-media
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: ALLOW_PRIVATE_DATASTORE_TRANSPORT
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: mk-school-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mk-school-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MEDIA_ROOT
        value: /var/data
      - key: PG_POOL_MAX
        value: "10"
      - key: VIDEO_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: VIDEO_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false

  - type: keyvalue
    name: mk-school-redis
    region: frankfurt
    plan: 256mb
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

databases:
  - name: mk-school-db
    region: frankfurt
    plan: 0.1c-256mb
    databaseName: mkschool
    user: mkschool
    ipAllowList: []
